name: pip and PyPI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      CFLAGS: -Wno-incompatible-pointer-types
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install --yes libgmp-dev

      - name: Install Logic1 and development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run tests
        run: make test

  build-sdist:
    name: Build source distribution
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build CPython ${{ matrix.python.version }} wheel (${{ matrix.on }})
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.on }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: '3.14'
            selector: cp314-*
        on:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7

      - name: Install GMP on macOS
        if: startsWith(matrix.on, 'macos')
        shell: bash
        run: |
          brew install gmp
          gmp_prefix="$(brew --prefix gmp)"
          {
            echo "CPPFLAGS=-I${gmp_prefix}/include"
            echo "LDFLAGS=-L${gmp_prefix}/lib"
          } >> "${GITHUB_ENV}"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      - name: Build wheel
        env:
          CIBW_ARCHS: >-
            ${{ case(
              endsWith(matrix.on, '-arm'), 'aarch64',
              startsWith(matrix.on, 'macos') && !endsWith(matrix.on, '-intel'), 'arm64',
              'x86_64'
            ) }}
          CIBW_BEFORE_ALL_LINUX: yum install --assumeyes gmp-devel
          CIBW_BUILD: ${{ matrix.python.selector }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: >-
            python -c "from gmpy2 import mpq; from logic1.theories.RCF.range import EndPoint;
            assert EndPoint(mpq(2)) * EndPoint(mpq(3)) == EndPoint(mpq(6))"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.python.version }}-${{ matrix.on }}
          path: wheelhouse/*.whl

  publish:
    name: Upload release to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs:
      - build-sdist
      - build-wheels
    environment:
      name: PyPI
      url: https://test.pypi.org/p/logic1
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          path: dist
          merge-multiple: true
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
