name: pip

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CFLAGS: -Wno-incompatible-pointer-types
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Logic1 and development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run tests
        run: make test
